name: Role task
about: Team role task with artifact gate and handoff
labels: needs-artifact
body:
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - analyst
        - designer
        - ios
        - qa
        - content
        - setup
        - teamlead
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be achieved?
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Expected artifact
      description: File, commit, mockup, doc, asset, or report path/link.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will the task be accepted?
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff
      description: Which downstream role/issue receives the result?
    validations:
      required: true
